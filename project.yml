name: PartsInventory
options:
  bundleIdPrefix: com.hitorro
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
  developmentLanguage: en
packages:
  PartsKit:
    path: PartsKit
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: T2M6R36LYY
    GENERATE_INFOPLIST_FILE: YES
targets:
  PartsInventory:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - path: App
    dependencies:
      - package: PartsKit
    entitlements:
      path: App/PartsInventory.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers: [iCloud.com.hitorro.PartsInventory]
        com.apple.developer.icloud-services: [CloudKit]
        aps-environment: development
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.device.camera: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.personal-information.photos-library: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hitorro.PartsInventory
        PRODUCT_NAME: Parts Inventory
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        ENABLE_HARDENED_RUNTIME: YES
        INFOPLIST_KEY_CFBundleDisplayName: Parts Inventory
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_NSCameraUsageDescription: "The camera scans bag labels and photographs parts to identify them."
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Photos of parts are read to identify them."
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIBackgroundModes: remote-notification
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  PartsInventoryTests:
    type: bundle.unit-test
    platform: macOS
    sources: [AppTests]
    dependencies:
      - target: PartsInventory
      - package: PartsKit
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Parts Inventory.app/Contents/MacOS/Parts Inventory"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  PartsInventory:
    build:
      targets:
        PartsInventory: all
    test:
      targets: [PartsInventoryTests]
